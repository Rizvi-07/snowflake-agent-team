name: Snowflake PR Dev lifecycle

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

concurrency:
  group: snowflake-pr-dev-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-dev:
    name: PR Dev validation and cleanup
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: development

    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      DBT_ENV_SECRET_SNOWFLAKE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
      DBT_TARGET_SCHEMA: PR_${{ github.event.pull_request.number }}_SILVER

    steps:
      - name: Check out proposed changes
        if: github.event.action != 'closed'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          python -m pip install "dbt-core==1.12.5" "dbt-snowflake==1.12.2"

      - name: Validate Dev settings and prepare private key
        env:
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          expected = {
              "SNOWFLAKE_USER": "AGENT_DEV_CI",
              "SNOWFLAKE_ROLE": "AGENT_DEV_ROLE",
              "SNOWFLAKE_DATABASE": "AGENTWAREHOUSEDEV",
              "SNOWFLAKE_WAREHOUSE": "DEV_COMPUTE_WH",
          }

          for name, value in expected.items():
              if os.environ.get(name, "").upper() != value:
                  raise SystemExit(
                      f"Check the development secret: {name}"
                  )

          schema = os.environ["DBT_TARGET_SCHEMA"]
          if not re.fullmatch(r"PR_[1-9][0-9]*_SILVER", schema):
              raise SystemExit("Invalid temporary PR schema")

          key = os.environ.get("SNOWFLAKE_PRIVATE_KEY", "")
          if not key.strip():
              raise SystemExit("SNOWFLAKE_PRIVATE_KEY is missing")

          key_path = (
              Path(os.environ["RUNNER_TEMP"])
              / "snowflake-dev-key.p8"
          )
          key_path.write_text(key, encoding="utf-8")
          key_path.chmod(0o600)
          PY

      - name: Check Snowflake Dev connection
        if: github.event.action != 'closed'
        run: |
          dbt debug --project-dir dbt --profiles-dir config/ci --target dev

      - name: Build and test in the PR schema
        if: github.event.action != 'closed'
        run: |
          dbt build --project-dir dbt --profiles-dir config/ci --target dev --select connection_check

      - name: Remove the closed PR's temporary schema
        if: github.event.action == 'closed'
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path
          import snowflake.connector

          schema = os.environ["DBT_TARGET_SCHEMA"]
          if not re.fullmatch(r"PR_[1-9][0-9]*_SILVER", schema):
              raise SystemExit("Refusing cleanup: invalid schema")

          database = os.environ["SNOWFLAKE_DATABASE"].upper()
          if database != "AGENTWAREHOUSEDEV":
              raise SystemExit("Refusing cleanup outside Dev")

          key_path = (
              Path(os.environ["RUNNER_TEMP"])
              / "snowflake-dev-key.p8"
          )

          connection = snowflake.connector.connect(
              account=os.environ["SNOWFLAKE_ACCOUNT"],
              user=os.environ["SNOWFLAKE_USER"],
              role=os.environ["SNOWFLAKE_ROLE"],
              warehouse=os.environ["SNOWFLAKE_WAREHOUSE"],
              database=database,
              authenticator="SNOWFLAKE_JWT",
              private_key_file=str(key_path),
              private_key_file_pwd=os.environ[
                  "DBT_ENV_SECRET_SNOWFLAKE_KEY_PASSPHRASE"
              ],
          )

          try:
              with connection.cursor() as cursor:
                  cursor.execute(
                      f'DROP SCHEMA IF EXISTS '
                      f'"{database}"."{schema}" CASCADE'
                  )
              print(f"Removed temporary schema: {database}.{schema}")
          finally:
              connection.close()
          PY

      - name: Remove temporary private key
        if: always()
        run: rm -f "$RUNNER_TEMP/snowflake-dev-key.p8"

  require-pr-validation:
    name: PR Dev validation required
    needs: pr-dev
    if: ${{ always() && github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Require successful database validation
        env:
          VALIDATION_RESULT: ${{ needs.pr-dev.result }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$PR_HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" ]; then
            echo "Fork PRs require a separate validation process."
            exit 1
          fi

          if [ "$VALIDATION_RESULT" != "success" ]; then
            echo "Database validation did not succeed: $VALIDATION_RESULT"
            exit 1
          fi

          echo "Snowflake PR validation passed."
