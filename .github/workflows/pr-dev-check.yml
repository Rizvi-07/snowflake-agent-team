name: Snowflake PR Dev lifecycle

on:
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: snowflake-pr-dev-${{ github.event.pull_request.number }}
  cancel-in-progress: false
  # Keep close/reopen events instead of replacing the single pending run.
  queue: max

jobs:
  pr-dev:
    name: PR Dev validation and cleanup
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: development

    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      DBT_ENV_SECRET_SNOWFLAKE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
      DBT_TARGET_SCHEMA: PR_${{ github.event.pull_request.number }}_SILVER

    steps:
      - name: Check out proposed changes
        if: github.event.action != 'closed'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check out closed PR code for cleanup
        if: github.event.action == 'closed'
        uses: actions/checkout@v7
        with:
          # Rejected/deleted branches may no longer have a merge ref.
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pinned pipeline dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate Dev settings and prepare private key
        env:
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          expected = {
              "SNOWFLAKE_USER": "AGENT_DEV_CI",
              "SNOWFLAKE_ROLE": "AGENT_DEV_ROLE",
              "SNOWFLAKE_DATABASE": "AGENTWAREHOUSEDEV",
              "SNOWFLAKE_WAREHOUSE": "DEV_COMPUTE_WH",
          }

          for name, value in expected.items():
              if os.environ.get(name, "").upper() != value:
                  raise SystemExit(
                      f"Check the development secret: {name}"
                  )

          schema = os.environ["DBT_TARGET_SCHEMA"]
          if not re.fullmatch(r"PR_[1-9][0-9]*_SILVER", schema):
              raise SystemExit("Invalid temporary PR schema")

          key = os.environ.get("SNOWFLAKE_PRIVATE_KEY", "")
          if not key.strip():
              raise SystemExit("SNOWFLAKE_PRIVATE_KEY is missing")

          key_path = (
              Path(os.environ["RUNNER_TEMP"])
              / "snowflake-dev-key.p8"
          )
          key_path.write_text(key, encoding="utf-8")
          key_path.chmod(0o600)
          PY

      - name: Validate products and connection check, or drain and clean closed PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/ci_pr_lifecycle.py

      - name: Remove temporary private key
        if: always()
        run: rm -f "$RUNNER_TEMP/snowflake-dev-key.p8"

  require-pr-validation:
    name: PR Dev validation required
    needs: pr-dev
    if: ${{ always() && github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Require successful validation and correct release branch
        env:
          VALIDATION_RESULT: ${{ needs.pr-dev.result }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_BASE_BRANCH: ${{ github.base_ref }}
          PR_HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          if [ "$PR_HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" ]; then
            echo "Fork PRs require a separate validation process."
            exit 1
          fi

          if [ "$PR_BASE_BRANCH" = "main" ] && [ "$PR_HEAD_BRANCH" != "dev" ]; then
            echo "Pull requests into main must come from dev."
            exit 1
          fi

          if [ "$VALIDATION_RESULT" != "success" ]; then
            echo "Database validation did not succeed: $VALIDATION_RESULT"
            exit 1
          fi

          echo "Validation and branch checks passed."
