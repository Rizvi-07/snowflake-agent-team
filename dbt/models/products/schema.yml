version: 2

models:
  - name: stg_products
    description: >-
      All Bronze products with integer IDs, NUMBER(18,2) prices, trimmed names
      and title-case categories. Invalid IDs/prices become null, never removed.
      Fractional IDs are rejected rather than rounded to a different product.
      Prices allow at most two fractional digits; fractional cents and exponent
      notation become null rather than being silently rounded or coerced.
      discounted_price is a demonstration 10% discount, round(price * 0.90, 2)
      rounded half up to NUMBER(18,2); price is unchanged.
    columns:
      - name: product_id
        data_tests: [not_null, unique]
      - name: product_name
        data_tests: [not_null, not_blank]
      - name: category
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [Electronics, Furniture]
      - name: price
        data_tests: [not_null, nonnegative]
      - name: source_filename
        data_tests: [not_null, not_blank]
      - name: batch_id
        data_tests: [not_null, not_blank]
      - name: ingested_at
        data_tests: [not_null]
      - name: discounted_price
        description: Price after a fixed 10% discount, rounded half up to cents.
        data_tests: [not_null, nonnegative]

  - name: product_category_summary
    description: >-
      One row per category. Counts include all Silver rows; prices are fixed-point
      and averages are represented to six decimal places. price_share_pct is each
      category's percentage of the total price across all categories, rounded
      half up once to NUMBER(5,2) with exact quotient/remainder arithmetic, and
      0.00 when that total is zero. price_range is maximum_price minus
      minimum_price, 0.00 for a single product or equal prices. Reconciliation tests
      compare every aggregate with Silver, including missing/extra categories.
    columns:
      - name: category
        data_tests:
          - not_null
          - unique
          - accepted_values:
              arguments:
                values: [Electronics, Furniture]
      - name: product_count
        data_tests: [not_null, nonnegative]
      - name: total_price
        data_tests: [not_null, nonnegative]
      - name: average_price
        data_tests: [not_null, nonnegative]
      - name: minimum_price
        data_tests: [not_null, nonnegative]
      - name: maximum_price
        data_tests: [not_null, nonnegative]
      - name: price_share_pct
        description: Category total price / total price across all categories x 100.
        data_tests: [not_null, nonnegative]
      - name: price_range
        description: Category maximum price minus minimum price.
        data_tests: [not_null, nonnegative]
